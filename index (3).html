dth=((index+1)/categories[cat].length*100)+'%';el('prompt').textContent=q[0];el('clue').textContent='English hint: '+q[3];el('answer').value='';el('feedback').innerHTML='';checked=false;el('answer').focus()}function feedback(correct,reveal=false){let q=categories[cat][index],key=cat+'|'+index;if(!attempted.has(key)){attempted.add(key);if(correct)score++}el('feedback').innerHTML=`<strong class="${correct?'good':'bad'}">${correct?'✓ Σωστά!':reveal?'Απάντηση:':'Δοκίμασε ξανά ή δες τη σωστή απάντηση.'}</strong> ${correct||reveal?'<strong>'+q[1]+'</strong><p>'+q[2]+'</p>':''}`;checked=correct||reveal}el('check').onclick=()=>{let q=categories[cat][index];feedback(normalize(el('answer').value)===normalize(q[1]))};el('show').onclick=()=>feedback(false,true);el('next').onclick=()=>{index=(index+1)%categories[cat].length;render()};el('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checked?el('next').click():el('check').click()}});renderTabs();render();</script></body></html>
